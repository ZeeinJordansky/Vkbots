name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Проверка Rust
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Привести исходники к формату
        run: cargo fmt --all
      - name: Проверить форматирование
        run: cargo fmt --all -- --check
      - name: Проверить компиляцию
        run: cargo check --all-targets --all-features
      - name: Проверить сборку без дополнительных возможностей
        run: cargo check --no-default-features
      - name: Проверить Long Poll без Callback API
        run: cargo check --no-default-features --features long-poll
      - name: Проверить Callback API без Long Poll
        run: cargo check --no-default-features --features callback
      - name: Запустить тесты
        run: cargo test --all-features
      - name: Проверить Clippy
        run: cargo clippy --all-targets --all-features
